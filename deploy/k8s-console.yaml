# Rogue Agent Web 控制台 Deployment + Service + 创建 Job 所需的 RBAC
# 控制台以 ROGUE_EXECUTION_MODE=k8s 运行时，通过 RBAC 动态创建一次性测评 Job。
apiVersion: v1
kind: ServiceAccount
metadata:
  name: rogue-console
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: rogue-console-job-creator
rules:
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["create", "get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: rogue-console-job-creator
subjects:
  - kind: ServiceAccount
    name: rogue-console
roleRef:
  kind: Role
  name: rogue-console-job-creator
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rogue-console
spec:
  replicas: 1
  selector:
    matchLabels: { app: rogue-console }
  template:
    metadata:
      labels: { app: rogue-console }
    spec:
      serviceAccountName: rogue-console
      containers:
        - name: console
          image: rogue-agent:latest
          command: ["uvicorn", "rogue.console.app:app", "--host", "0.0.0.0", "--port", "4080"]
          env:
            - name: ROGUE_EXECUTION_MODE
              value: "k8s"
            - name: ROGUE_NAMESPACE
              valueFrom: { fieldRef: { fieldPath: metadata.namespace } }
            - name: ROGUE_JOB_IMAGE
              value: "rogue-agent:latest"
            - name: ROGUE_SECRET_NAME
              value: "rogue-secrets"
            - name: GOOGLE_API_KEY
              valueFrom:
                secretKeyRef: { name: rogue-secrets, key: GOOGLE_API_KEY, optional: true }
            # rogue agent 自身 LLM 走 OpenAI 兼容 API 时配置（与 GOOGLE_API_KEY 二选一）
            - name: ROGUE_LLM_BASE_URL
              value: "https://api.deepseek.com/v1"
            - name: ROGUE_LLM_API_KEY
              valueFrom:
                secretKeyRef: { name: rogue-secrets, key: ROGUE_LLM_API_KEY, optional: true }
            - name: EVAL_GENERATOR_MODEL
              value: "deepseek-chat"
            - name: ES_ENDPOINT
              value: "http://elasticsearch:9200"
            - name: ES_API_KEY
              valueFrom:
                secretKeyRef: { name: rogue-secrets, key: ES_API_KEY, optional: true }
          ports:
            - containerPort: 4080
          resources:
            requests: { cpu: "200m", memory: "256Mi" }
            limits: { cpu: "1", memory: "512Mi" }
---
apiVersion: v1
kind: Service
metadata:
  name: rogue-console
spec:
  selector: { app: rogue-console }
  ports:
    - port: 80
      targetPort: 4080
